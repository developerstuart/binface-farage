<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Farage vs Count Binface</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        z-index: 999;
        transition: opacity 0.3s ease;
      }
      #loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-title {
        color: #00ccff;
        font: bold 28px monospace;
        letter-spacing: 0.2em;
        text-align: center;
      }
      .loading-title span {
        color: #ff4444;
      }
      .loading-bar-wrap {
        width: min(300px, 80vw);
        height: 10px;
        background: #222;
        border-radius: 5px;
        overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%;
        background: #00ccff;
        border-radius: 5px;
        animation: loadpulse 1.4s ease-in-out infinite;
      }
      @keyframes loadpulse {
        0%   { width: 5%; }
        50%  { width: 85%; }
        100% { width: 5%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-bar-fill { animation: none; width: 50%; }
        #loading-overlay { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay" aria-live="polite" aria-label="Game loading">
      <div class="loading-title"><span>FARAGE</span> vs COUNT BINFACE</div>
      <div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
